{% extends "base.html" %}

{% block title %}Edit Expense — Spendly{% endblock %}

{% block content %}

<section class="auth-section">
    <div class="auth-container">

        <div class="auth-header">
            <h1 class="auth-title">Edit expense</h1>
            <p class="auth-subtitle">Update this transaction</p>
        </div>

        <div class="auth-card">
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                <div class="auth-error">{{ messages[0] }}</div>
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('edit_expense', id=id) }}">
                <div class="form-group">
                    <label for="amount">Amount</label>
                    <input type="number" id="amount" name="amount" step="0.01" min="0.01"
                           class="form-input" placeholder="0.00"
                           value="{{ values.amount }}" required autofocus>
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category" class="form-input" required>
                        <option value="" disabled {% if not values.category %}selected{% endif %}>Select a category</option>
                        {% for cat in categories %}
                        <option value="{{ cat }}" {% if values.category == cat %}selected{% endif %}>{{ cat }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date"
                           class="form-input"
                           value="{{ values.date }}" required>
                </div>
                <div class="form-group">
                    <label for="description">Description (optional)</label>
                    <input type="text" id="description" name="description"
                           class="form-input" placeholder="e.g. Groceries"
                           value="{{ values.description }}">
                </div>
                <button type="submit" class="btn-submit">Save changes</button>
            </form>
        </div>

    </div>
</section>

{% endblock %}
